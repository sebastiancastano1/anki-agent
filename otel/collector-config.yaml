# OTel Collector — recibe spans de la app, calcula el COSTO aquí (OTTL),
# y reparte: trazas → Tempo, métricas (spanmetrics + costo) → Prometheus.
# El precio vive en este archivo: cambiar tarifa = editar YAML + reiniciar.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

  # Cálculo de costo para claude-sonnet-4-6 (USD por 1M tokens):
  #   input $3 · output $15 · cache-write $3.75 · cache-read $0.30
  # Anthropic/Traceloop reportan input_tokens SOLO como no-cacheados, así que
  # se facturan input, cache-write y cache-read como líneas separadas.
  transform/llm_cost:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          # Solo actuamos sobre spans LLM (los que traen output_tokens).
          # Inicializamos cada componente en 0 y lo sobrescribimos si hay tokens,
          # porque OTTL en esta versión no soporta el operador `??`.
          - set(attributes["app.cost.input"], 0.0)
            where attributes["gen_ai.usage.output_tokens"] != nil
          - set(attributes["app.cost.output"], 0.0)
            where attributes["gen_ai.usage.output_tokens"] != nil
          - set(attributes["app.cost.cache_write"], 0.0)
            where attributes["gen_ai.usage.output_tokens"] != nil
          - set(attributes["app.cost.cache_read"], 0.0)
            where attributes["gen_ai.usage.output_tokens"] != nil
          - set(attributes["app.cost.input"],
                Double(attributes["gen_ai.usage.input_tokens"]) / 1000000.0 * 3.0)
            where attributes["gen_ai.usage.input_tokens"] != nil
          - set(attributes["app.cost.output"],
                Double(attributes["gen_ai.usage.output_tokens"]) / 1000000.0 * 15.0)
            where attributes["gen_ai.usage.output_tokens"] != nil
          - set(attributes["app.cost.cache_write"],
                Double(attributes["gen_ai.usage.cache_creation_input_tokens"]) / 1000000.0 * 3.75)
            where attributes["gen_ai.usage.cache_creation_input_tokens"] != nil
          - set(attributes["app.cost.cache_read"],
                Double(attributes["gen_ai.usage.cache_read_input_tokens"]) / 1000000.0 * 0.30)
            where attributes["gen_ai.usage.cache_read_input_tokens"] != nil
          # Total = suma plana (los 4 componentes ya existen en spans LLM).
          - set(attributes["app.cost.total"],
                attributes["app.cost.input"]
              + attributes["app.cost.output"]
              + attributes["app.cost.cache_write"]
              + attributes["app.cost.cache_read"])
            where attributes["gen_ai.usage.output_tokens"] != nil

connectors:
  # Métricas RED (rate/errors/duration) por span, con dimensiones seguras → Prometheus.
  # El COSTO no se suma aquí (el contrib estándar no trae sum connector): el costo vive
  # como atributo de span en Tempo y se agrega con TraceQL metrics (sum(span.app.cost.total)).
  spanmetrics:
    histogram:
      explicit:
        buckets: [100ms, 250ms, 500ms, 1s, 2s, 5s, 10s, 30s, 60s]
    dimensions:
      - name: app.gen_ai.cache_hit
      - name: gen_ai.response.model
    metrics_flush_interval: 15s

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true

  # --- Fan-out a Langfuse (segunda fuente, observabilidad LLM) ---
  # El MISMO span va también a Langfuse, sin tocar la app. Demuestra el
  # desacople instrumentación <-> backend. Langfuse exige auth: header Basic
  # con base64(public_key:secret_key), inyectado por env (LANGFUSE_OTEL_AUTH).
  # Solo activo cuando se levanta el stack con docker-compose.langfuse.yml.
  otlphttp/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    headers:
      Authorization: "Basic ${env:LANGFUSE_OTEL_AUTH:-}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/llm_cost, batch]
      # Si LANGFUSE_OTEL_AUTH está vacío (stack Langfuse no levantado), el
      # exporter falla silenciosamente por span y el resto del fan-out sigue.
      exporters: [otlp/tempo, otlphttp/langfuse, spanmetrics]
    metrics:
      receivers: [spanmetrics]
      processors: [batch]
      exporters: [prometheus]
